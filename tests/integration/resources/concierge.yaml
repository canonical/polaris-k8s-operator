juju:
  channel: 3.6/stable
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG

providers:
  k8s:
    enable: true
    channel: 1.35-classic/stable
    features:
      local-storage:
      load-balancer:
        enabled: true
        l2-mode: true
        cidrs: 10.64.0.0/16
    bootstrap-constraints:
      root-disk: 4G

  lxd:
    enable: true
    channel: 6/stable

host:
  packages:
    - pipx
    - python3-dev
    - python3-pip
    - python3-venv
  snaps:
    yq:
      channel: latest/stable
    microceph:
      channel: squid/stable
    kubectl:
      channel: latest/stable
    just:
      channel: latest/stable
    aws-cli:
      channel: latest/stable
