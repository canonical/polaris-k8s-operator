summary: Run integration-storage-vended tests

prepare: |
  # The setup here consists in
  # 1. Enabling RGW
  # 2. Enabling STS support so that we can use vended credentials
  # 3. Creating the appropriate role so that use STS

  export IP=$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc')

  sudo microceph cluster bootstrap
  sudo microceph disk add loop,1G,3
  sudo microceph enable rgw

  sudo microceph.ceph config set global rgw_s3_auth_use_sts true
  sudo microceph.ceph config set global rgw_sts_key "1234567890abcdef"
  sudo snap restart microceph

  for i in $(seq 1 10); do
    if curl -s "http://$IP/" > /dev/null 2>&1; then
      echo "RGW is ready"
      break
    fi
    echo "Waiting for RGW..."
    sleep 5
  done

  sudo microceph.radosgw-admin user create \
    --uid test --display-name test \
    --access-key=foo --secret-key=bar

  sudo microceph.radosgw-admin caps add --uid="test" --caps="roles=*"
  cat > /tmp/assume-role-policy.json <<'EOF'
  {
    "Version": "2012-10-17",
    "Statement": [
      {
        "Effect": "Allow",
        "Principal": {"AWS": ["arn:aws:iam:::user/test"]},
        "Action": ["sts:AssumeRole"]
      }
    ]
  }
  EOF
  cat > /tmp/role-policy.json <<'EOF'
  {
    "Version": "2012-10-17",
    "Statement": [
      {
        "Effect": "Allow",
        "Action": ["s3:*"],
        "Resource": ["arn:aws:s3:::test-bucket", "arn:aws:s3:::test-bucket/*"]
      }
    ]
  }
  EOF
  export AWS_ACCESS_KEY_ID=foo
  export AWS_SECRET_ACCESS_KEY=bar
  export AWS_DEFAULT_REGION=us-east-1
  ROLE_ARN=$(aws --endpoint-url "http://$IP" iam create-role \
    --role-name polaris-test-role \
    --assume-role-policy-document file:///tmp/assume-role-policy.json \
    --query 'Role.Arn' --output text)
  aws --endpoint-url "http://$IP" iam put-role-policy \
    --role-name polaris-test-role \
    --policy-name polaris-test-policy \
    --policy-document file:///tmp/role-policy.json

  {
    echo "S3_SERVER_URL=http://$IP"
    echo "S3_ACCESS_KEY=foo"
    echo "S3_SECRET_KEY=bar"
    echo "S3_ROLE_ARN=$ROLE_ARN"
    echo "S3_USER_ARN=arn:aws:iam:::user/test"
  } > "$SPREAD_PATH/.env"

execute: |
  cd "$SPREAD_PATH"
  tox run -e integration-storage-vended -- --model testing --keep-models
