name: polaris-k8s
display-name: Polaris K8s
summary: Kubernetes based charm for Apache Polaris
description: |
  This is a charm for Apache Polaris.

  It provides an Iceberg REST Catalog that users can use
  to interact with Apache Iceberg tables.

  Apache Polaris is a free, open source software project by the Apache Software Foundation.
  Users can find out more at the [Polaris project page](https://polaris.apache.org/).
source: https://github.com/canonical/polaris-k8s-operator
issues: https://github.com/canonical/polaris-k8s-operator/issues
website:
  - https://github.com/canonical/polaris-k8s-operator
  - https://matrix.to/#/%23charmhub-analytics%3Aubuntu.com

assumes:
  - juju >= 3.6
  - k8s-api

charm-user: non-root

containers:
  polaris:
    resource: polaris-image
  console:
    resource: polaris-console-image

resources:
  polaris-image:
    type: oci-image
    description: OCI image for Polaris, both server and admin tool.
    # Polaris 1.7.0 - 2026-08-28
    upstream-source: ghcr.io/canonical/charmed-polaris@sha256:677e2e0adcaec954d0e48df0d9d6b7e6523b529d82f679645a68af91537192c5
    uid: 584792
    gid: 584792
  polaris-console-image:
    type: oci-image
    description: OCI image for Polaris Console.
    # 0.1.0-bare_edge - 2026-09-16
    upstream-source: ghcr.io/canonical/polaris-console@sha256:c8b8b855bdf6aa4d324aa30358f88d61b0586fb436370a4771637bf902420e6a
    uid: 584792
    gid: 584792

peers:
  polaris-peers:
    interface: polaris-peers

  status-peers:
    interface: status_peers

requires:
  client-certificates:
    interface: tls-certificates
    limit: 1
    optional: true

  ingress:
    interface: ingress
    limit: 1
    optional: true

  logging:
    interface: loki_push_api
    limit: 1
    optional: true

  metastore:
    interface: postgresql_client
    limit: 1
    optional: false

  oauth:
    interface: oauth
    limit: 1
    optional: true

  receive-ca-certs:
    interface: certificate_transfer
    limit: 1
    optional: true

  s3-credentials:
    interface: s3
    limit: 1
    optional: false # TODO(object-storage): mark as optional once we support others

provides:
  grafana-dashboard:
    interface: grafana_dashboard
    limit: 1
    optional: true

  metrics-endpoint:
    interface: prometheus_scrape
    limit: 1
    optional: true
