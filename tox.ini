[tox]
no_package = True
skip_missing_interpreters = True
min_version = 4.0.0
env_list =
    format
    lint
    unit
    integration-charm


[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
    charm: TESTFILE=test_charm.py
    storage-vended: TESTFILE=test_storage_vended.py
    storage-non-vended: TESTFILE=test_storage_non_vended.py
    observability: TESTFILE=test_observability.py
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS
    USER
allowlist_externals =
    poetry
deps =
    poetry

[testenv:format]
description = Apply coding style standards to code
commands_pre =
    poetry install --only format
commands =
    poetry install --only format
    poetry run ruff format {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards, and static checks
commands_pre =
    poetry install --only lint
commands =
    poetry run ruff format --check --diff {[vars]all_path}
    poetry run ruff check --fix {[vars]all_path}
    poetry run codespell {tox_root}
    poetry install
    poetry run zmypy src


[testenv:unit]
description = Run unit tests
commands_pre =
    poetry install --only main,charm-libs,unit
commands =
    coverage run --source={[vars]src_path} -m pytest \
        -v \
        -s \
        --tb native \
        {[vars]tests_path}/unit \
        {posargs}
    coverage report

[testenv:integration-{charm,storage-vended,storage-non-vended,observability}]
description = Run integration tests
set_env =
    {[testenv]set_env}
pass_env =
    {[testenv]pass_env}
    CI
commands_pre =
    poetry install --only main,charm-libs,integration
commands =
    pytest -vv --tb native --log-cli-level=INFO -s {posargs} {[vars]tests_path}/integration/{env:TESTFILE} -x

