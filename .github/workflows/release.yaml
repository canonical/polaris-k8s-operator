name: Release to Charmhub

on:
  push:
    branches:
      - 1/edge

permissions:
  contents: read

jobs:
  ci-tests:
    uses: ./.github/workflows/ci.yaml

  release-charm:
    name: Release charm
    needs:
      - ci-tests
    uses: canonical/data-platform-workflows/.github/workflows/release_charm_edge.yaml@6f9c6da60190e1860d33e82da04498a56ea64725 # v51.0.0
    with:
      track: 1
      artifact-prefix: ${{ needs.ci-tests.outputs.artifact-prefix }}
    secrets:
      charmhub-token: ${{ secrets.CHARMHUB_TOKEN_EDGE }}
    permissions:
      contents: write # Needed to create git tags
